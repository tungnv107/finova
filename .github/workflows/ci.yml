name: Finova CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finova_test
          POSTGRES_USER: finova
          POSTGRES_PASSWORD: finova_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finova -d finova_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://finova:finova_ci_only@localhost:5432/finova_test?schema=public
      BETTER_AUTH_SECRET: finova-ci-ephemeral-secret-only-32-chars
      BETTER_AUTH_URL: http://localhost:3002
      NEXT_PUBLIC_APP_URL: http://localhost:3002
      FINOVA_TEST_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm run security:routes
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:integration
      - run: npm run test:security-integration
      - run: npm run db:reconcile
      - run: npm run build
